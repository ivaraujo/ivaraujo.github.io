<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarifas</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Roboto', sans-serif;
            width: 100%;
            height: 100vh;
            background-color: #B0AEAE;
        }

        h1{
            text-transform: uppercase;
            text-align: center;
        }

        main{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
            gap:20px;
        }

        .main{
            background-color: #B0AEAE;
        }

        main form{
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            margin: 0 auto;
            padding: 0px 10px;
        }

        label{
            font-size: 18px;
            text-align: justify;
        }

        input{
            padding: 10px;
        }

        button{
            padding: 10px;
            background-color: #569cf7;
            color: white;
            font-weight: bolder;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: #3a7bc8;
        }

        #container_resultado{
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 95%;
            height: 100%;
            min-height: 80px;
            padding: 10px;
            background-color: rgba(86, 156, 247, 0.548);
            border: 1px solid #569cf7;
            border-radius: 10px;
            gap: 10px;
        }

        #container_resultado p{
            width: 100%;
            text-align: center;
        }

        #resultado{
            text-align: center;
            color: blue;
        }

        @media (min-width: 600px){
            body{
                background-color: #fff;
            }

            .main{
                max-width: 600px;
                border-radius: 10px;
            }
        }
    </style>
</head>
<body>
    <main class="main">
        <img src="./icons/bus.png" alt="Tarifas" width="100" height="100">
        <h1>Calculadora de Tarifas</h1>
        <form action="" method="get">
            <label for="valor">Valor da tarifa:</label>
            <input type="number" id="valor" name="valor" step="0.01" min="1" placeholder="0,00" required>
            <label for="dias">Dias:</label>
            <input type="number" id="dias" name="dias" step="0.01" min="1" value="23" placeholder="Digite o número de dias" required>
            <button type="submit">Calcular</button>
        </form>
        <div id="container_resultado">
            <p>O total da tarifa é:</p>
            <div id="resultado"></div>
        </div>
    </main>   
</body>

<script>
    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault();
        const valor = parseFloat(document.getElementById('valor').value);
        const dias = parseInt(document.getElementById('dias').value);
        const resultado = document.getElementById('resultado');
        
        if (isNaN(valor) || isNaN(dias)) {
            resultado.textContent = 'Por favor, insira valores válidos.';
            return;
        }

        const total = valor * dias;
        resultado.textContent = `R$ ${total.toFixed(2)}`;
    });
</script>
</html>
